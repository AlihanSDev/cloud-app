name: Cloud App CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-and-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Build Docker image
        run: docker build -t cloud-app:github-actions .

      - name: Smoke test container
        run: |
          docker run -d --name ci-smoke -p 5002:5000 cloud-app:github-actions
          curl --fail --retry 10 --retry-delay 1 --retry-connrefused http://localhost:5002/ | grep -q "Cloud Technologies Laboratory"
          echo "✅ Container responds correctly"

      - name: Stop smoke container
        if: always()
        run: docker rm -f ci-smoke || true
